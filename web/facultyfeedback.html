<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Total Feedback Per Faculty</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #c850c0, #4158d0);
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px;
            margin-top: 50px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #ffc107;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            color: black;
            border-radius: 10px;
            overflow: hidden; /* Ensure rounded corners for the table */
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #ffc107;
            font-weight: bold;
            color: black; /* Change text color for better contrast */
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: rgba(255, 193, 7, 0.3);
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #e74c3c; /* Button color */
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.3s, transform 0.3s;
            font-size: 16px;
            text-align: center; /* Center the text */
            cursor: pointer; /* Change cursor to pointer */
        }

        .back-btn:hover {
            background-color: #c0392b; /* Darker red on hover */
            transform: scale(1.05); /* Slightly enlarge button */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Total Feedback Per Faculty</h1>
        <table id="facultyFeedbackTable">
            <thead>
                <tr>
                    <th>Faculty Name</th>
                    <th>Department</th>
                    <th>Total Feedback</th>
                </tr>
            </thead>
            <tbody>
                <!-- Table rows will be dynamically added here -->
            </tbody>
        </table>
        <a href="#" class="back-btn" onclick="goBack()">Back to Dashboard</a>
    </div>

    <script>
        // Sample data (replace this with actual data from your backend)
        const facultyFeedbackData = [
            { name: "Prof.Sherilyn maam", department: "IT", totalFeedback: 85 },
            { name: "Prof. Poonam maam", department: "IT", totalFeedback: 78 },
            
        ];

        // Function to populate the table with faculty feedback data
        function populateTable() {
            const tableBody = document.querySelector("#facultyFeedbackTable tbody");
            
            facultyFeedbackData.forEach(faculty => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${faculty.name}</td>
                    <td>${faculty.department}</td>
                    <td>${faculty.totalFeedback}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        // Function to go back to the dashboard
       function goBack() {
            // Replace this with the actual URL of your dashboard
            window.location.href = "admin.html";
        }

        // Call the populateTable function to display the data
        populateTable();
    </script>
</body>
</html>
