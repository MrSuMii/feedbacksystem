<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Feedbacks</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="viewfeedbacks.css"> <!-- Link to your CSS file -->
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <div class="user-info">
        <img src="admin.png" alt="Admin Image" class="user-image">
        <h3>Admin Panel</h3>
      </div>
      <nav class="menu">
           <ul>
                        <li><a href="admin.html"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
                        <li><a href="addfaculty.html"><i class="fas fa-user-plus"></i> Add Faculty</a></li>
                        <li><a href="managefaculty.jsp"><i class="fas fa-users-cog"></i> Manage Faculty</a></li>
                        <li><a href="managestudents.html"><i class="fas fa-user-graduate"></i> Manage Students</a></li>
                        <li><a href="viewfeedbacks.html"><i class="fas fa-comments"></i> View Feedbacks</a></li>
                        <li><a href="createquestions.jsp"><i class="fas fa-question-circle"></i> Create Feedback Questions</a></li>
                        <li><a href="adminprofile.html"><i class="fas fa-user"></i> View/Edit Profile</a></li>
                        <li><a href="adminupdatepass.html"><i class="fas fa-key"></i> Update Password</a></li>
                        <li><a href="logoutstudent.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
                    </ul>
      </nav>
    </aside>

    <div class="content">
      <div class="header">
        <h1>View Feedbacks</h1>
        <button class="logout-btn" onclick="window.location.href='logout.html';">Logout</button>
      </div>

      <table id="feedback-table">
        <thead>
          <tr>
            <th>Faculty</th>
            <th>Student</th>
            <th>Feedback</th>
          </tr>
        </thead>
        <tbody>
          <!-- Feedback data will go here -->
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const feedbackData = [
      { faculty: 'Prof. Poonam', student: 'Ram', feedback: 'Great course!' },
      { faculty: 'Prof. Sherilyn', student: 'Shyam', feedback: 'Best Course.' }
    ];

    const feedbackTable = document.getElementById('feedback-table').getElementsByTagName('tbody')[0];

    feedbackData.forEach(feedback => {
      const row = feedbackTable.insertRow();
      row.insertCell(0).textContent = feedback.faculty;
      row.insertCell(1).textContent = feedback.student;
      row.insertCell(2).textContent = feedback.feedback;
    });

    function logout() {
            // Show custom message
            alert("Thank you for using the Faculty Management System. Have a great day!");
            
            // Close the current tab
            window.close();
            
            // If the window.close() method doesn't work (as it might be blocked by some browsers),
            // we can redirect to a blank page as a fallback
            window.location.href = "index.html";
        }
  </script>
</body>
</html>
