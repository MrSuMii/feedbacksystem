<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* General Styles */
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #6a11cb, #2575fc);
      color: #fff;
    }

    /* Container */
    .container {
      display: flex;
      min-height: 100vh;
    }

    /* Sidebar */
    .sidebar {
      width: 250px;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 0;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.3);
      transform: translateX(-100%);
      transition: transform 0.3s ease;
    }

    .sidebar.active {
      transform: translateX(0);
    }

    .sidebar img {
      border-radius: 50%;
      width: 100px;
      margin-bottom: 10px;
    }

    .sidebar h3 {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      width: 100%;
    }

    .sidebar ul li {
      margin: 10px 0;
    }

    .sidebar ul li a {
      color: #ddd;
      font-size: 16px;
      text-decoration: none;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      transition: 0.3s;
    }

    .sidebar ul li a:hover {
      color: #ffd700;
      background: #333;
      border-radius: 5px;
    }

    .sidebar ul li a i {
      margin-right: 10px;
    }

    /* Hamburger Menu */
    .hamburger {
  display: flex;
  position: fixed;  /* Keep it fixed */
  top: 20px;
  left: 20px;
  background: none;
  border: none;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  z-index: 1100; /* Ensure it stays on top */
}


    /* Main Content */
    .main-content {
      flex: 1;
      padding: 20px;
      transition: margin-left 0.3s ease;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #1e1e2f;
      height: 40px;
      padding: 15px 20px;
    color: white;
    border-radius: 8px;
    }
    @media (max-width: 768px) {
      .dashboard-header {
        margin-left: 35px;
      }
    }
    .logout-btn {
      background: #ff4d4d;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background: #ff1a1a;
    }

    /* Profile Edit Form */
    .profile-edit-form {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      color: #333;
    }

    .profile-picture-upload img {
      width: 100px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .profile-picture-upload label {
      font-weight: 500;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    .form-actions .btn {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-right: 10px;
    }

    .save-btn {
      background: #2575fc;
      color: #fff;
    }

    .save-btn:hover {
      background: #0056b3;
    }

    .reset-btn {
      background: #ddd;
    }

    .reset-btn:hover {
      background: #bbb;
    }

    /* Responsive Styles */
    @media (max-width: 768px) {
      .hamburger {
        display: block;
        margin-top: 25px;
      }
    

      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100%;
        z-index: 1000;
      }

      .sidebar.active {
        transform: translateX(0);
      }
      .main-content {
        margin-left: 0;
      }
    }
    /* Sidebar visible by default on larger screens */
@media (min-width: 768px) {
  .sidebar {
    transform: translateX(0); /* Ensure sidebar is always visible */
  }

  .main-content {
     /* Adjust main content to accommodate sidebar */
    transition: margin-left 0.3s ease;
  }

  .hamburger {
    display: none; /* Hide hamburger menu on larger screens */
  }
}

/* Sidebar hidden by default on smaller screens */
@media (max-width: 768px) {
  .sidebar {
    transform: translateX(-100%); /* Hide sidebar initially */
    transition: transform 0.3s ease;
  }

  .main-content {
    margin-left: 0; /* No margin when sidebar is hidden */
  }
}
/* Default hamburger color (white for larger screens) */
.hamburger {
  color: white;
  
}

/* When screen width is less than 900px, change hamburger to black */


/* Hide logout button when screen width is less than 450px */
@media (max-width: 450px) {
  .logout-btn {
    display: none;
  }
}

 /*<!-- updated css */
 
  </style>
</head>
<body>
  <div class="container">
    <button class="hamburger" id="hamburger-menu">
      <i class="fas fa-bars"></i>
    </button>
    <aside class="sidebar" id="sidebar">
      <div class="profile-info">
        <img src="faculty.jpg" alt="Profile Image" class="profile-pic">
        <h3>HELLO SUMIT</h3>
      </div>
      <nav class="menu">
        <ul>
          <li><a href="faculty.jsp"><i class="fas fa-tachometer-alt"></i> Dashboard</a></li>
          <li><a href="viewFeedback.jsp"><i class="fas fa-comments"></i> View Feedback</a></li>
          <li><a href="profile.html"><i class="fas fa-user-edit"></i> Edit Profile</a></li>
          <li><a href="updateFaculty.jsp"><i class="fas fa-key"></i> Update Password</a></li>
          <li><a href="logoutfaculty.html"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
        </ul>
      </nav>
    </aside>
    <main class="main-content">
      <header class="dashboard-header">
        <h1>Edit Profile</h1>
        <button class="logout-btn" onclick="window.location.href='logoutfaculty.html';">Logout</button>
      </header>
      <section class="profile-edit-form">
        <div class="profile-picture-upload">
          <img src="account.jpeg" alt="profile photo" class="profile-pic-preview">
          <label for="profile-image">Change Profile Image:</label>
          <input type="file" id="profile-image" name="profile-image">
        </div>
        <form action="#" method="POST">
          <div class="form-group">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
          </div>
          <div class="form-group">
            <label for="phone">Mobile Number:</label>
            <input type="text" id="phone" name="phone" placeholder="Enter your phone number">
          </div>
          <div class="form-group">
            <label for="program">Program:</label>
            <select id="program" name="program">
              <option value="btech" selected>B.Tech</option>
              <option value="bsc">B.Sc</option>
              <option value="bca">BCA</option>
            </select>
          </div>
          <div class="form-group">
            <label for="semester">Semester:</label>
            <select id="semester" name="semester">
              <option value="1" selected>I</option>
              <option value="2">II</option>
              <option value="3">III</option>
              <option value="4">IV</option>
              <option value="5">V</option>
              <option value="6">VI</option>
            </select>
          </div>
          <div class="form-group">
            <label for="gender">Gender:</label>
            <select id="gender" name="gender">
              <option value="male" selected>Male</option>
              <option value="female">Female</option>
              <option value="other">Other</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="submit" class="btn save-btn">Update My Profile</button>
            <button type="reset" class="btn reset-btn">Reset</button>
          </div>
        </form>
      </section>
    </main>
  </div>
  <script>
    const hamburger = document.getElementById('hamburger-menu');
const sidebar = document.getElementById('sidebar');

// Function to toggle sidebar
function toggleSidebar() {
  sidebar.classList.toggle('active');
}

// Event listener for hamburger button
hamburger.addEventListener('click', function () {
  toggleSidebar();
});

    function logout() {
      alert('Logged out successfully.');
      window.location.href = 'login.html';
    }
  </script>
  
</body>
</html>
